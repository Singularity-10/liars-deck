<!DOCTYPE html>
<html lang="zh-CN">
<!--
  og-image.html —— 社交分享卡片模板（1200×630）
  由 build-og-image.py 渲染成 web/og-image.png。
  字体占位符 {{FONT_FACE}} 会在渲染时被替换成内联了 woff2 的 @font-face
  （直接用相对路径在 file:// 下会被 Chromium 的同源策略挡掉，所以必须内联）。
-->
<head>
<meta charset="UTF-8">
<style>
  {{FONT_FACE}}
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    background:
      radial-gradient(ellipse 700px 420px at 12% -12%, rgba(212,162,78,0.22), transparent 70%),
      radial-gradient(ellipse 620px 460px at 96% 116%, rgba(192,69,62,0.16), transparent 70%),
      radial-gradient(ellipse 900px 500px at 50% 50%, rgba(60,44,26,0.55), transparent 75%),
      #14100b;
    color: #e8ddc8;
    font-family: 'LXGWTITLE', 'Noto Serif CJK SC', 'PingFang SC', 'Microsoft YaHei', serif;
    position: relative;
  }
  /* 木纹竖条：呼应游戏内酒馆背景 */
  .grain {
    position: absolute; inset: 0; opacity: .30;
    background-image: repeating-linear-gradient(90deg,
      rgba(0,0,0,.55) 0 2px, rgba(255,255,255,.028) 2px 5px, rgba(0,0,0,.30) 5px 9px);
  }
  .wrap { position: relative; z-index: 2; display: flex; height: 100%; align-items: center; padding: 0 76px; }

  .left { flex: 1; max-width: 660px; }
  .tag {
    display: inline-block; border: 1px solid rgba(212,162,78,.75); color: #d4a24e;
    border-radius: 999px; padding: 7px 22px; font-size: 21px; letter-spacing: .34em;
    font-family: 'Noto Sans CJK SC', sans-serif; margin-bottom: 30px;
  }
  h1 {
    font-family: 'LXGWTITLE', 'Noto Serif CJK SC', serif;
    font-size: 158px; line-height: 1; font-weight: 500; letter-spacing: .06em;
    background: linear-gradient(178deg, #f6e3b4 6%, #e8c078 46%, #b8802f 96%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: 0 10px 48px rgba(212,162,78,.30);
  }
  .latin {
    margin-top: 16px; font-size: 25px; letter-spacing: .42em; color: #9c8f78;
    font-family: 'Noto Sans CJK SC', sans-serif;
  }
  .rule { width: 126px; height: 3px; margin: 30px 0 26px;
    background: linear-gradient(90deg, #e8c078, rgba(232,192,120,0)); }
  .slogan { font-size: 41px; color: #efe3ca; letter-spacing: .10em; }
  .slogan b { color: #7ec8d8; font-weight: 500; }
  .sub { margin-top: 20px; font-size: 26px; color: #9c8f78; letter-spacing: .04em;
    font-family: 'Noto Sans CJK SC', sans-serif; white-space: nowrap; }

  /* 右侧图形：扇形三张牌 + 左轮弹巢（一颗实弹） */
  .art { position: relative; width: 470px; height: 470px; flex: none; }
  .card {
    position: absolute; left: 118px; top: 96px; width: 172px; height: 246px;
    border-radius: 15px; border: 2px solid rgba(212,162,78,.62);
    background: linear-gradient(165deg, rgba(48,37,23,.92), rgba(26,20,13,.94));
    box-shadow: 0 20px 48px rgba(0,0,0,.55);
    display: flex; align-items: center; justify-content: center;
    font-size: 82px; color: #d4a24e; font-family: 'LXGWTITLE', serif;
  }
  .card.c1 { transform: rotate(-19deg) translate(-92px, 14px); opacity: .62; }
  .card.c2 { transform: rotate(-8deg)  translate(-44px, 2px);  opacity: .82; }
  .card.c3 { transform: rotate(6deg)   translate(4px, 0); }
  /* 左轮弹巢：圈里只有一颗实弹 —— 整个游戏的核心母题 */
  .cylinder {
    position: absolute; left: 318px; top: 286px; width: 124px; height: 124px;
    border-radius: 50%; border: 2px solid rgba(212,162,78,.55);
    background: radial-gradient(circle at 38% 32%, rgba(74,58,34,.85), rgba(24,19,13,.9));
    box-shadow: 0 16px 40px rgba(0,0,0,.5);
  }
  .cylinder::before {
    content: ''; position: absolute; left: 50%; top: 50%; width: 60px; height: 60px;
    transform: translate(-50%,-50%); border-radius: 50%;
    border: 1px dashed rgba(212,162,78,.34);
  }
  .bullet {
    position: absolute; left: 50%; top: 50%; width: 26px; height: 26px; border-radius: 50%;
    transform: translate(-50%,-50%) rotate(28deg) translateY(-19px);
    background: radial-gradient(circle at 34% 30%, #f7e2b3, #cf9440 58%, #6d4715);
    box-shadow: 0 0 26px rgba(232,192,120,.6);
  }

  .foot {
    position: absolute; left: 76px; bottom: 40px; z-index: 3;
    font-size: 22px; color: #6f6349; letter-spacing: .05em;
    font-family: 'Noto Sans CJK SC', sans-serif;
  }
  .corner {
    position: absolute; right: 56px; bottom: 40px; z-index: 3;
    font-size: 20px; color: #6f6349; letter-spacing: .16em;
    font-family: 'Noto Sans CJK SC', sans-serif;
  }
</style>
</head>
<body>
  <div class="grain"></div>
  <div class="wrap">
    <div class="left">
      <span class="tag">LIARS TAVERN</span>
      <h1>酒馆</h1>
      <div class="latin">LIAR'S DECK</div>
      <div class="rule"></div>
      <div class="slogan">真话保命，<b>谎话上膛</b>。</div>
      <div class="sub">中文网页版 · 免安装 · 手机即玩</div>
    </div>
    <div class="art">
      <div class="card c1"></div>
      <div class="card c2"></div>
      <div class="card c3">Q</div>
      <div class="cylinder"><div class="bullet"></div></div>
    </div>
  </div>
  <div class="foot">singularity-10.github.io/liars-deck</div>
  <div class="corner">MIT 开源</div>
</body>
</html>
